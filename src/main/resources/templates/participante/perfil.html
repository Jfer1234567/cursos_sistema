<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head('Mi Perfil')}"></head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container" style="margin-top: 1.5rem;">
        <div th:replace="~{fragments/alerts :: alerts}"></div>
    </div>

    <div class="container" style="padding: 2.5rem 1.5rem; max-width: 650px;">
        <div class="card card-body" style="padding: 2.5rem; border-top: 4px solid var(--primary);">
            <div style="margin-bottom: 2rem;">
                <h1 style="font-size: 1.8rem; margin-bottom: 0.25rem;">Mi Perfil</h1>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Información personal registrada en el IIICCD.</p>
            </div>

            <form th:action="@{/participante/perfil}" method="post">
                <div class="form-group">
                    <label class="form-label">Correo Electrónico (No editable)</label>
                    <input type="email" class="form-control" th:value="${usuario.correo}" disabled>
                </div>

                <div class="form-group">
                    <label class="form-label">Documento de Identidad (No editable)</label>
                    <input type="text" class="form-control" th:value="${usuario.tipoDocumento + ': ' + usuario.numeroDocumento}" disabled>
                </div>

                <div class="form-group">
                    <label class="form-label" for="nombreCompleto">Nombre Completo *</label>
                    <input type="text" id="nombreCompleto" name="nombreCompleto" class="form-control" th:value="${usuario.nombreCompleto}" required>
                    <span class="form-text">Este nombre se imprimirá en los certificados emitidos.</span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="telefono">Teléfono / WhatsApp *</label>
                    <input type="tel" id="telefono" name="telefono" class="form-control" 
                           th:value="${usuario.telefono}" maxlength="9" inputmode="numeric" pattern="[0-9]{9}" required>
                    <small class="form-text" style="color: var(--text-muted); font-size: 0.78rem;">Exactamente 9 dígitos numéricos (celular Perú)</small>
                </div>

                <div class="form-group">
                    <label class="form-label" for="institucionProcedencia">Institución de Procedencia *</label>
                    <input type="text" id="institucionProcedencia" name="institucionProcedencia" class="form-control" th:value="${usuario.institucionProcedencia}" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem;">
                    Guardar Cambios
                </button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const telInput = document.getElementById('telefono');
            if (telInput) {
                telInput.addEventListener('input', function() {
                    this.value = this.value.replace(/[^0-9]/g, '').slice(0, 9);
                });
            }
        });
    </script>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
