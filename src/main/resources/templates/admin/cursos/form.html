<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head('Formulario de Curso')}"></head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container" style="margin-top: 1.5rem;">
        <div th:replace="~{fragments/alerts :: alerts}"></div>
    </div>

    <div class="container" style="padding: 2.5rem 1.5rem; max-width: 900px;">
        <div style="margin-bottom: 1.5rem;">
            <a th:href="@{/admin/cursos}" class="btn btn-sm btn-outline">&larr; Volver al Listado</a>
        </div>

        <div class="card card-body" style="padding: 2.5rem; border-top: 4px solid var(--primary);">
            <h1 style="font-size: 1.85rem; margin-bottom: 0.5rem;"
                th:text="${cursoDTO.id == null ? 'Crear Nuevo Curso' : 'Editar Curso'}">
                Formulario de Curso
            </h1>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem;">
                Ingresa los datos académicos y detalles de configuración del curso.
            </p>

            <form th:action="@{/admin/cursos/guardar}" th:object="${cursoDTO}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="form-group">
                    <label class="form-label" for="nombre">Nombre Oficial del Curso *</label>
                    <input type="text" id="nombre" th:field="*{nombre}" class="form-control" placeholder="Ej. Deep Learning y Visión Computacional Avanzada">
                    <div th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="form-error"></div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                    <div class="form-group">
                        <label class="form-label" for="areaInvestigacionId">Línea y Área de Investigación *</label>
                        <select id="areaInvestigacionId" th:field="*{areaInvestigacionId}" class="form-select">
                            <option value="">-- Seleccionar Área --</option>
                            <option th:each="area : ${areas}"
                                    th:value="${area.id}"
                                    th:text="${area.lineaInvestigacion.nombre + ' &rarr; ' + area.nombre}">
                                Área
                            </option>
                        </select>
                        <div th:if="${#fields.hasErrors('areaInvestigacionId')}" th:errors="*{areaInvestigacionId}" class="form-error"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="docenteResponsable">Docente Responsable *</label>
                        <input type="text" id="docenteResponsable" th:field="*{docenteResponsable}" class="form-control" placeholder="Ej. Dr. Leonid Alemán Gonzales">
                        <div th:if="${#fields.hasErrors('docenteResponsable')}" th:errors="*{docenteResponsable}" class="form-error"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="descripcionCorta">Descripción Corta (para tarjetas del catálogo)</label>
                    <input type="text" id="descripcionCorta" th:field="*{descripcionCorta}" class="form-control" placeholder="Breve resumen de 1 a 2 líneas">
                </div>

                <div class="form-group">
                    <label class="form-label" for="descripcion">Descripción Completa y Temario *</label>
                    <textarea id="descripcion" th:field="*{descripcion}" class="form-control" rows="6" placeholder="Detalle completo de módulos, requisitos y objetivos..."></textarea>
                    <div th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}" class="form-error"></div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label class="form-label" for="precio">Precio (S/ PEN) *</label>
                        <input type="number" step="0.10" id="precio" th:field="*{precio}" class="form-control" placeholder="120.00">
                        <div th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}" class="form-error"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="cuposTotales">Cupos Totales *</label>
                        <input type="number" id="cuposTotales" th:field="*{cuposTotales}" class="form-control" placeholder="25">
                        <div th:if="${#fields.hasErrors('cuposTotales')}" th:errors="*{cuposTotales}" class="form-error"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="duracion">Duración *</label>
                        <input type="text" id="duracion" th:field="*{duracion}" class="form-control" placeholder="Ej. 40 horas académicas">
                        <div th:if="${#fields.hasErrors('duracion')}" th:errors="*{duracion}" class="form-error"></div>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label class="form-label" for="fechaInicio">Fecha de Inicio</label>
                        <input type="date" id="fechaInicio" th:field="*{fechaInicio}" class="form-control">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="fechaFin">Fecha de Fin</label>
                        <input type="date" id="fechaFin" th:field="*{fechaFin}" class="form-control">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="estado">Estado del Curso *</label>
                        <select id="estado" th:field="*{estado}" class="form-select">
                            <option th:each="est : ${estados}" th:value="${est}" th:text="${est}">BORRADOR</option>
                        </select>
                    </div>
                </div>

                <!-- Enlace Privado de Clases Virtuales -->
                <div class="form-group" style="background: #F8FAFC; border: 1px solid var(--border); padding: 1.25rem; border-radius: var(--radius-sm);">
                    <label class="form-label" for="enlaceClase" style="color: var(--primary);">
                        🔒 Enlace de Sesión Virtual (Zoom / Google Meet)
                    </label>
                    <input type="url" id="enlaceClase" th:field="*{enlaceClase}" class="form-control" placeholder="https://meet.google.com/xxx-xxxx-xxx o link de Zoom">
                    <span class="form-text">
                        <strong>Seguridad:</strong> Este enlace solo será visible para aquellos participantes cuya inscripción haya sido APROBADA por la directiva.
                    </span>
                </div>

                <div style="margin-top: 2rem; display: flex; gap: 1rem;">
                    <button type="submit" class="btn btn-lg btn-primary">Guardar Curso</button>
                    <a th:href="@{/admin/cursos}" class="btn btn-lg btn-outline">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
