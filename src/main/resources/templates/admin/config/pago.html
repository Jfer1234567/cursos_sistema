<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head('Configuración de Datos de Pago Yape')}"></head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container" style="margin-top: 1.5rem;">
        <div th:replace="~{fragments/alerts :: alerts}"></div>
    </div>

    <div class="container" style="padding: 2.5rem 1.5rem; max-width: 800px;">
        <div style="margin-bottom: 1.5rem;">
            <a th:href="@{/admin}" class="btn btn-sm btn-outline">&larr; Volver al Panel</a>
        </div>

        <div class="card card-body" style="padding: 2.5rem; border-top: 4px solid var(--primary);">
            <div style="margin-bottom: 2rem;">
                <span class="badge badge-primary">Finanzas y Cobros</span>
                <h1 style="font-size: 1.85rem; margin-top: 0.25rem;">Configuración de Yape</h1>
                <p style="color: var(--text-muted); font-size: 0.9rem;">
                    Actualiza el número, titular o código QR de Yape sin necesidad de modificar el código fuente.
                </p>
            </div>

            <form th:action="@{/admin/config/pago}" method="post" enctype="multipart/form-data">
                <div class="form-group">
                    <label class="form-label" for="numeroYape">Número de Celular Yape *</label>
                    <input type="text" id="numeroYape" name="numeroYape" class="form-control" th:value="${configPago.numeroYape}" required>
                    <span class="form-text">Número al que los participantes transferirán su inscripción.</span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="titularYape">Nombre del Titular de la Cuenta *</label>
                    <input type="text" id="titularYape" name="titularYape" class="form-control" th:value="${configPago.titularYape}" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="instrucciones">Instrucciones para el Participante *</label>
                    <textarea id="instrucciones" name="instrucciones" class="form-control" rows="4" required th:text="${configPago.instrucciones}"></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">Imagen QR de Yape Actual</label>
                    <div style="margin-bottom: 1rem;">
                        <img th:src="${configPago.qrImagenUrl != null ? configPago.qrImagenUrl : '/images/yape-qr-default.png'}"
                             alt="QR de Pago Actual"
                             style="max-width: 150px; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px;">
                    </div>
                    <label class="form-label" for="qrFile">Subir Nueva Imagen de QR (Opcional)</label>
                    <input type="file" id="qrFile" name="qrFile" class="form-control" accept="image/*">
                    <span class="form-text">Si no seleccionas ninguna imagen, se conservará la actual.</span>
                </div>

                <button type="submit" class="btn btn-lg btn-primary btn-block" style="margin-top: 1.5rem;">
                    Guardar Configuración de Pago
                </button>
            </form>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
