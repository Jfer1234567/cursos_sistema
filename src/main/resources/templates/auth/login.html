<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head('Iniciar Sesión')}"></head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container" style="margin-top: 1.5rem;">
        <div th:replace="~{fragments/alerts :: alerts}"></div>
    </div>

    <div class="container">
        <div class="auth-wrapper">
            <div class="card card-body" style="padding: 2.5rem; border-top: 4px solid var(--primary);">
                <div class="auth-header">
                    <img th:src="@{/images/logo-iiiccd.jpg}" alt="Logo IIICCD" style="height: 64px; margin-bottom: 1rem;">
                    <h2 style="font-size: 1.6rem; color: var(--primary);">Iniciar Sesión</h2>
                    <p style="color: var(--text-muted); font-size: 0.9rem;">Accede a tu panel para gestionar tus cursos y certificados.</p>
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="form-group">
                        <label class="form-label" for="correo">Correo Electrónico</label>
                        <input type="email" id="correo" name="correo" class="form-control" required placeholder="tu.correo@ejemplo.com" autofocus>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Contraseña</label>
                        <input type="password" id="password" name="password" class="form-control" required placeholder="••••••••">
                    </div>

                    <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem;">
                        Ingresar a la Plataforma
                    </button>
                </form>

                <div style="margin-top: 1.5rem; text-align: center; border-top: 1px solid var(--border-subtle); padding-top: 1.25rem; font-size: 0.9rem;">
                    ¿Aún no tienes cuenta? <a th:href="@{/registro}" style="font-weight: 600;">Regístrate aquí</a>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
