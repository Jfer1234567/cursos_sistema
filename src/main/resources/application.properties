spring.application.name=cursos

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/cursos_iiiccd
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Uploads Configuration
app.uploads.dir=file:${user.dir}/uploads/
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Mail Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:test@gmail.com}
spring.mail.password=${MAIL_PASSWORD:secret}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Custom Admin Property
app.admin.initial.email=admin@iiiccd.edu.pe
app.admin.initial.password=admin123
app.admin.initial.name=Administrador IIICCD
